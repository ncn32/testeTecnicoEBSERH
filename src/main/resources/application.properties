# Configuration file
# key = value
#--------------- VARIAVEIS DO PRÓPRIO GRUPO ---------------
MODO_MOCK=${MODO_MOCK}
EBSERH_PACIENTES_TESTE=${EBSERH_PACIENTES_TESTE}

#--------------- BANCO DE DADOS SQLITE ---------------
BD_URL=jdbc:sqlite:C:\\BASIS\\EBSERH\\testeTecnicoEBSERH\\pacientesEBSERH.sqlite
BD_USUARIO=
BD_SENHA=
BD_SIMULTANEO=3


#quarkus.log.category."io.quarkus".level=DEBUG
quarkus.log.category."io.quarkus".level=INFO

#--------------- SEGURANCA / KEYCLOAK (OIDC) ---------------
# Valores sensiveis vem do ambiente (ver _executar.bat). A API atua como
# "service" (bearer-only): valida o token JWT emitido pelo Keycloak.
# Desabilitado ate o Keycloak estar disponivel. Para ativar: mude para true,
# defina as variaveis OIDC_* (ver _executar.bat) e reconstrua (build-time).
quarkus.oidc.enabled=false
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:pacientes-api}
quarkus.oidc.credentials.secret=${OIDC_SECRET:}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_AUTH_SERVER_URL:}
# Papeis (roles) do realm chegam em realm_access.roles do access token.
quarkus.oidc.roles.source=accesstoken
# Rejeita tokens emitidos para outro cliente/audiencia.
quarkus.oidc.token.audience=${OIDC_CLIENT_ID:pacientes-api}

#--------------- SWAGGER / OPENAPI ---------------
# Mantem o Swagger UI disponivel tambem no modo empacotado (nao apenas em dev).
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=EBSERH Pacientes API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=CRUD de Pacientes e Historico
# Integra o botao "Authorize" do Swagger UI com o login do Keycloak.
quarkus.swagger-ui.oauth-client-id=${OIDC_SWAGGER_CLIENT_ID:pacientes-swagger}

